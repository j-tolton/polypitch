function pruneTiles(minIndex,maxIndex){for(const [k,t] of tileCache){if(t.index<minIndex-2||t.index>maxIndex+1)tileCache.delete(k)}}

const touches=new Map();let gesture=null;

 e.preventDefault()},{passive:false});

 e.preventDefault()},{passive:false});
